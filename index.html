<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Flashcard & Quiz Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 3D Flip Animation Styling */
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-indigo-600 rounded-lg text-white">
          <i class="fa-solid fa-brain text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white leading-tight">FlashStudy AI</h1>
          <p class="text-xs text-slate-400">Interactive Flashcard & Quiz Hub</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button id="btn-add-card" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium transition flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> Add Card
        </button>
        <button id="btn-export" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-sm font-medium transition flex items-center gap-2">
          <i class="fa-solid fa-download"></i> Export JSON
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full flex flex-col gap-8">
    
    <!-- Top Control Bar -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <span class="text-sm font-medium text-slate-400">Deck Progress:</span>
        <div class="w-48 bg-slate-700 h-3 rounded-full overflow-hidden">
          <div id="progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
        </div>
        <span id="progress-text" class="text-sm font-semibold text-slate-300">0%</span>
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
        <button id="btn-shuffle" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs rounded-lg transition flex items-center gap-1.5">
          <i class="fa-solid fa-shuffle"></i> Shuffle
        </button>
        <button id="btn-reset" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs rounded-lg transition flex items-center gap-1.5">
          <i class="fa-solid fa-rotate-right"></i> Reset Progress
        </button>
      </div>
    </div>

    <!-- Flashcard Display Area -->
    <div class="flex flex-col items-center justify-center gap-6 my-auto">
      
      <!-- Card Container -->
      <div class="w-full max-w-lg h-72 perspective-1000 cursor-pointer" id="flashcard-container">
        <div id="flashcard" class="w-full h-full relative transform-style-3d transition-transform duration-500 shadow-2xl rounded-2xl">
          
          <!-- Front Face -->
          <div class="absolute inset-0 w-full h-full bg-slate-800 border-2 border-indigo-500/50 rounded-2xl p-6 flex flex-col justify-between backface-hidden">
            <div class="flex justify-between items-center text-xs font-semibold text-indigo-400">
              <span id="card-category">CATEGORY</span>
              <span id="card-number">1 / 1</span>
            </div>
            <div class="text-center px-4">
              <h2 id="card-question" class="text-xl sm:text-2xl font-bold text-slate-100 leading-snug">Loading question...</h2>
            </div>
            <div class="text-center text-xs text-slate-500">
              <i class="fa-solid fa-rotate"></i> Click card to reveal answer
            </div>
          </div>

          <!-- Back Face -->
          <div class="absolute inset-0 w-full h-full bg-indigo-900/90 border-2 border-indigo-400 rounded-2xl p-6 flex flex-col justify-between backface-hidden rotate-y-180">
            <div class="flex justify-between items-center text-xs font-semibold text-indigo-200">
              <span>ANSWER</span>
              <i class="fa-solid fa-circle-check text-emerald-400"></i>
            </div>
            <div class="text-center px-4">
              <p id="card-answer" class="text-lg sm:text-xl font-medium text-indigo-50 leading-relaxed">Loading answer...</p>
            </div>
            <div class="text-center text-xs text-indigo-300">
              Rate your confidence below
            </div>
          </div>

        </div>
      </div>

      <!-- Action & Confidence Buttons -->
      <div class="flex flex-col sm:flex-row items-center gap-4 w-full max-w-lg">
        <button id="btn-needs-review" class="flex-1 w-full py-3 bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-300 font-medium rounded-xl transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-xmark"></i> Needs Review
        </button>
        <button id="btn-mastered" class="flex-1 w-full py-3 bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 text-emerald-300 font-medium rounded-xl transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-check"></i> Mastered
        </button>
      </div>

      <!-- Navigation Arrows -->
      <div class="flex items-center gap-6 mt-2">
        <button id="btn-prev" class="p-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full transition">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <span id="counter" class="text-sm font-semibold text-slate-400">Card 1 of 1</span>
        <button id="btn-next" class="p-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full transition">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

    </div>

  </main>

  <!-- Add Card Modal -->
  <div id="modal-add-card" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl flex flex-col gap-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 class="text-lg font-bold text-white">Add New Flashcard</h3>
        <button id="btn-close-modal" class="text-slate-400 hover:text-white">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      
      <form id="form-new-card" class="flex flex-col gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Category</label>
          <input type="text" id="input-category" placeholder="e.g. JavaScript, History" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Question / Prompt</label>
          <textarea id="input-question" rows="2" placeholder="What is a closure in JavaScript?" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 text-sm focus:outline-none focus:border-indigo-500"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Answer</label>
          <textarea id="input-answer" rows="3" placeholder="A function bundled together with references to its surrounding state..." required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-slate-100 text-sm focus:outline-none focus:border-indigo-500"></textarea>
        </div>
        
        <div class="flex gap-2 justify-end pt-2">
          <button type="button" id="btn-cancel-modal" class="px-4 py-2 bg-slate-700 text-slate-300 rounded-lg text-sm font-medium hover:bg-slate-600 transition">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-500 transition">Save Card</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Initial Sample Deck
    const DEFAULT_DECK = [
      { id: 1, category: "JavaScript", question: "What is the difference between 'let' and 'var'?", answer: "'let' is block-scoped, whereas 'var' is function-scoped and hoisted.", mastered: false },
      { id: 2, category: "Web Tech", question: "What does HTML stand for?", answer: "HyperText Markup Language.", mastered: false },
      { id: 3, category: "JavaScript", question: "What is an Event Listener?", answer: "A procedure in JavaScript that waits for an event to occur (like a click or keypress).", mastered: false },
      { id: 4, category: "CSS", question: "What is Flexbox used for?", answer: "A 1D layout model for distributing space along a single row or column.", mastered: false }
    ];

    let deck = JSON.parse(localStorage.getItem('flashcard_deck')) || DEFAULT_DECK;
    let currentIndex = 0;
    let isFlipped = false;

    // DOM Elements
    const cardContainer = document.getElementById('flashcard-container');
    const flashcard = document.getElementById('flashcard');
    const cardCategory = document.getElementById('card-category');
    const cardNumber = document.getElementById('card-number');
    const cardQuestion = document.getElementById('card-question');
    const cardAnswer = document.getElementById('card-answer');
    const counter = document.getElementById('counter');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');

    // Controls
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnNeedsReview = document.getElementById('btn-needs-review');
    const btnMastered = document.getElementById('btn-mastered');
    const btnShuffle = document.getElementById('btn-shuffle');
    const btnReset = document.getElementById('btn-reset');
    const btnExport = document.getElementById('btn-export');

    // Modal Elements
    const btnAddCard = document.getElementById('btn-add-card');
    const modalAddCard = document.getElementById('modal-add-card');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const btnCancelModal = document.getElementById('btn-cancel-modal');
    const formNewCard = document.getElementById('form-new-card');

    // Render Current Card
    function renderCard() {
      if (deck.length === 0) {
        cardCategory.textContent = "EMPTY";
        cardNumber.textContent = "0 / 0";
        cardQuestion.textContent = "No flashcards available. Add one above!";
        cardAnswer.textContent = "Click 'Add Card' to create a new card.";
        counter.textContent = "0 of 0";
        updateProgress();
        return;
      }

      if (isFlipped) {
        flashcard.classList.remove('rotate-y-180');
        isFlipped = false;
      }

      setTimeout(() => {
        const card = deck[currentIndex];
        cardCategory.textContent = card.category.toUpperCase();
        cardNumber.textContent = `${currentIndex + 1} / ${deck.length}`;
        cardQuestion.textContent = card.question;
        cardAnswer.textContent = card.answer;
        counter.textContent = `Card ${currentIndex + 1} of ${deck.length}`;
        updateProgress();
      }, isFlipped ? 250 : 0);
    }

    // Update Progress Bar
    function updateProgress() {
      if (deck.length === 0) {
        progressBar.style.width = '0%';
        progressText.textContent = '0%';
        return;
      }

      const masteredCount = deck.filter(c => c.mastered).length;
      const percentage = Math.round((masteredCount / deck.length) * 100);
      progressBar.style.width = `${percentage}%`;
      progressText.textContent = `${percentage}%`;
    }

    // Save to Local Storage
    function saveData() {
      localStorage.setItem('flashcard_deck', JSON.stringify(deck));
    }

    // Card Flip
    cardContainer.addEventListener('click', () => {
      if (deck.length === 0) return;
      isFlipped = !isFlipped;
      flashcard.classList.toggle('rotate-y-180');
    });

    // Navigation
    btnNext.addEventListener('click', () => {
      if (deck.length === 0) return;
      currentIndex = (currentIndex + 1) % deck.length;
      renderCard();
    });

    btnPrev.addEventListener('click', () => {
      if (deck.length === 0) return;
      currentIndex = (currentIndex - 1 + deck.length) % deck.length;
      renderCard();
    });

    // Rating Buttons
    btnMastered.addEventListener('click', () => {
      if (deck.length === 0) return;
      deck[currentIndex].mastered = true;
      saveData();
      btnNext.click();
    });

    btnNeedsReview.addEventListener('click', () => {
      if (deck.length === 0) return;
      deck[currentIndex].mastered = false;
      saveData();
      btnNext.click();
    });

    // Shuffle & Reset
    btnShuffle.addEventListener('click', () => {
      deck.sort(() => Math.random() - 0.5);
      currentIndex = 0;
      renderCard();
    });

    btnReset.addEventListener('click', () => {
      deck.forEach(card => card.mastered = false);
      saveData();
      renderCard();
    });

    // Export Data
    btnExport.addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(deck, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "flashcards.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    // Modal Controls
    btnAddCard.addEventListener('click', () => modalAddCard.classList.remove('hidden'));
    btnCloseModal.addEventListener('click', () => modalAddCard.classList.add('hidden'));
    btnCancelModal.addEventListener('click', () => modalAddCard.classList.add('hidden'));

    formNewCard.addEventListener('submit', (e) => {
      e.preventDefault();
      const newCard = {
        id: Date.now(),
        category: document.getElementById('input-category').value,
        question: document.getElementById('input-question').value,
        answer: document.getElementById('input-answer').value,
        mastered: false
      };
      deck.push(newCard);
      saveData();
      currentIndex = deck.length - 1;
      formNewCard.reset();
      modalAddCard.classList.add('hidden');
      renderCard();
    });

    // Initial Load
    renderCard();
  </script>
</body>
</html>
